name: Scientific MCP stack
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v6
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('uv.lock') }}
      - run: make bootstrap
      - run: make lint
      - run: make test test-template
      - run: make render contract-docs
      - run: git diff --exit-code -- config/schemas docs/contracts/example-v1.md
      - run: docker compose --profile core --profile dev --profile observability config --quiet
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
      - uses: docker/setup-buildx-action@v4
      - run: make bootstrap
      - run: make test-integration test-e2e
      - run: make up
      - run: make health tools
      - run: STACK_ENDPOINT=http://127.0.0.1:8765/mcp make test-e2e
      - run: .venv/bin/uv sync --locked --group browser
      - run: .venv/bin/playwright install --with-deps chromium
      - run: DASHBOARD_ENDPOINT=http://127.0.0.1:8766 .venv/bin/python -m pytest tests/browser -q
      - run: make fault-check
      - run: docker compose --profile core --profile dev build test-runner
      - run: docker compose --profile core --profile dev run --rm test-runner
      - run: docker build -f templates/python_scientific_mcp/Dockerfile -t example-scientific-mcp:0.1.0 .
      - if: failure()
        run: docker compose --profile core logs --no-color --tail=150
      - if: always()
        run: make down
